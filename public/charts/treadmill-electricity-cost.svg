<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What a treadmill costs to run per month</title><desc id="d">Typical use at the US average of about 17¢ per kWh. Standby costs a few cents.</desc>
